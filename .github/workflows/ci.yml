name: Research checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      caps:
        description: Run the slower keyed cap sweep
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONOPTIMIZE: "0"

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: cffconvert --validate
      - run: python -m unittest discover -s tests -v
      - run: python tools/make_manifest.py --check
      - run: python tools/run_checks.py --output work/checks
      - name: Optional cap sweep
        if: ${{ inputs.caps && runner.os == 'Linux' }}
        run: python tools/run_checks.py --output work/checks-with-caps --caps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: checks-${{ runner.os }}
          path: work/checks*/
          retention-days: 14

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formalization
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
      - name: Fetch the required Mathlib modules
        working-directory: formalization
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
        run: lake exe cache get Mathlib.Analysis.SpecialFunctions.Sqrt Mathlib.MeasureTheory.Integral.Bochner.Basic Mathlib.Tactic.Linarith Mathlib.Tactic.Ring Mathlib.Analysis.SpecialFunctions.Log.Basic
      - name: Check theorem axioms
        working-directory: formalization
        run: python verify.py --output ../work/lean-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lean-verification
          path: work/lean-verification.json
          retention-days: 14

  paper:
    name: Manuscript and source consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - run: python tools/build_paper.py --bibtex --report work/paper/build.json
      - run: python tools/check_sources.py --output work/paper/sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: manuscript-checks
          path: |
            work/paper/
            paper/paper.pdf
          retention-days: 14
