[tool.ruff]
target-version = "py313"
line-length = 100
include = ["tools/**/*.py", "experiments/**/*.py", "tests/**/*.py", "formalization/*.py"]
extend-exclude = ["history", "audits", ".venv", "formalization/.lake"]

[tool.ruff.lint]
select = ["E4", "E9", "F63", "F7", "F82", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
